<!-- mz-net-notice -->
<script>
(function () {
  // Уведомление «технические неполадки / включи VPN»: появляется, если запросы к серверу или картинки не загружаются
  if (window.__mzNetNotice) return;
  window.__mzNetNotice = true;

  var SNOOZE_MS = 10 * 60 * 1000;       // после закрытия не беспокоим 10 минут
  var DEBOUNCE_MS = 900;                // даём шанс повторному запросу, прежде чем показывать
  var MEDIA_LIMIT = 3, MEDIA_WINDOW = 12000;
  var timer = 0, shownKind = '', failHost = '', mediaErrors = [];

  var TEXTS = {
    net: {
      title: 'Технические неполадки',
      text: 'Не удалось связаться с сервером. Если данные не появляются — включи средство обхода блокировок (VPN) и обнови страницу.'
    },
    media: {
      title: 'Часть страницы не загрузилась',
      text: 'Картинки или файлы не открываются. Возможно, у тебя блокировка — включи средство обхода блокировок (VPN) и обнови страницу.'
    },
    offline: {
      title: 'Нет подключения к интернету',
      text: 'Проверь соединение. Если интернет есть, а сайт не грузится — включи средство обхода блокировок (VPN).'
    }
  };

  function snoozed() {
    try { return Date.now() - Number(sessionStorage.getItem('mz_net_notice_closed') || 0) < SNOOZE_MS; } catch (e) { return false; }
  }
  function hostOf(url) { try { return new URL(url, location.href).host; } catch (e) { return ''; } }

  function injectStyle() {
    if (document.getElementById('mzNetStyle')) return;
    var st = document.createElement('style');
    st.id = 'mzNetStyle';
    st.textContent =
      '#mzNetNotice{position:fixed;left:50%;bottom:18px;z-index:2147482000;width:calc(100% - 28px);max-width:540px;' +
      'transform:translate(-50%,0);display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;' +
      'background:rgba(12,0,0,.96);border:1px solid rgba(255,60,60,.4);box-shadow:0 0 40px rgba(255,0,0,.22),0 10px 40px rgba(0,0,0,.5);' +
      'font-family:"Press Start 2P",monospace;color:rgba(255,225,225,.92);animation:mznIn .3s cubic-bezier(.22,.61,.36,1)}' +
      '#mzNetNotice[hidden]{display:none}' +
      '#mzNetNotice .mzn-icon{font-size:16px;line-height:1;flex-shrink:0;margin-top:2px}' +
      '#mzNetNotice .mzn-body{flex:1;min-width:0}' +
      '#mzNetNotice .mzn-title{font-size:9px;line-height:1.7;color:#ff5555;letter-spacing:.5px;margin-bottom:6px}' +
      '#mzNetNotice .mzn-text{font-size:7px;line-height:2;color:rgba(255,215,215,.8);overflow-wrap:anywhere}' +
      '#mzNetNotice .mzn-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}' +
      '#mzNetNotice button{font-family:inherit;cursor:pointer}' +
      '#mzNetNotice .mzn-btn{font-size:7px;line-height:1;padding:9px 12px;border-radius:999px;color:#fff;border:0;' +
      'background:linear-gradient(135deg,#ff2a2a,#b00000);box-shadow:0 0 12px rgba(255,0,0,.35)}' +
      '#mzNetNotice .mzn-x{flex-shrink:0;background:none;border:0;color:rgba(255,200,200,.5);font-size:11px;line-height:1;padding:4px 6px}' +
      '#mzNetNotice .mzn-x:hover{color:#ff2a2a}' +
      '@keyframes mznIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}' +
      '@media (prefers-reduced-motion:reduce){#mzNetNotice{animation:none}}';
    (document.head || document.documentElement).appendChild(st);
  }

  function build() {
    var el = document.getElementById('mzNetNotice');
    if (el) return el;
    injectStyle();
    el = document.createElement('div');
    el.id = 'mzNetNotice';
    el.setAttribute('role', 'alert');
    el.hidden = true;
    var icon = document.createElement('div'); icon.className = 'mzn-icon'; icon.textContent = '⚠️';
    var body = document.createElement('div'); body.className = 'mzn-body';
    var title = document.createElement('div'); title.className = 'mzn-title';
    var text = document.createElement('div'); text.className = 'mzn-text';
    var actions = document.createElement('div'); actions.className = 'mzn-actions';
    var reload = document.createElement('button'); reload.type = 'button'; reload.className = 'mzn-btn'; reload.textContent = 'Обновить страницу';
    reload.addEventListener('click', function () { location.reload(); });
    actions.appendChild(reload);
    body.appendChild(title); body.appendChild(text); body.appendChild(actions);
    var close = document.createElement('button'); close.type = 'button'; close.className = 'mzn-x'; close.setAttribute('aria-label', 'Закрыть'); close.textContent = '✕';
    close.addEventListener('click', function () {
      try { sessionStorage.setItem('mz_net_notice_closed', String(Date.now())); } catch (e) {}
      hide();
    });
    el.appendChild(icon); el.appendChild(body); el.appendChild(close);
    (document.body || document.documentElement).appendChild(el);
    return el;
  }

  function show(kind) {
    if (snoozed() && kind !== 'offline') return;
    function go() {
      var el = build();
      el.querySelector('.mzn-title').textContent = TEXTS[kind].title;
      el.querySelector('.mzn-text').textContent = TEXTS[kind].text;
      el.hidden = false;
      shownKind = kind;
    }
    if (document.body) go(); else document.addEventListener('DOMContentLoaded', go, { once: true });
  }
  function hide() {
    var el = document.getElementById('mzNetNotice');
    if (el) el.hidden = true;
    shownKind = '';
  }

  function noteFailure(host) {
    failHost = host;
    clearTimeout(timer);
    timer = setTimeout(function () { show(navigator.onLine === false ? 'offline' : 'net'); }, DEBOUNCE_MS);
  }
  function noteSuccess(host) {
    // успешный запрос к тому же серверу — связь восстановилась
    if (host && host === failHost) {
      clearTimeout(timer);
      if (shownKind === 'net') hide();
      failHost = '';
    }
  }

  var origFetch = window.fetch;
  if (typeof origFetch === 'function') {
    window.fetch = function (input) {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      var host = hostOf(url);
      return origFetch.apply(this, arguments).then(function (res) {
        if (res && (res.status === 0 || (res.status >= 502 && res.status <= 504))) noteFailure(host);
        else noteSuccess(host);
        return res;
      }, function (err) {
        if (!(err && err.name === 'AbortError')) noteFailure(host);
        throw err;
      });
    };
  }

  // несколько подряд не загрузившихся картинок/видео — тоже признак блокировки
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (!t || !t.tagName || ['IMG', 'VIDEO', 'SOURCE'].indexOf(t.tagName) === -1) return;
    var now = Date.now();
    mediaErrors = mediaErrors.filter(function (ts) { return now - ts < MEDIA_WINDOW; });
    mediaErrors.push(now);
    if (mediaErrors.length >= MEDIA_LIMIT && !shownKind) show('media');
  }, true);

  window.addEventListener('offline', function () { show('offline'); });
  window.addEventListener('online', function () { if (shownKind === 'offline') hide(); });
})();
</script>

<script>
  setTimeout(function () {
    var g = document.getElementById('loadingGate');
    if (g) g.style.display = 'none';
  }, 8000);
</script>
<script src="/mezets.design/common.js" onerror="var g=document.getElementById('loadingGate'); if(g) g.style.display='none';"></script>
<script>


  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  let dots = [];
  function initDots() {
    dots = [];
    const n = Math.round((innerWidth * innerHeight) / 9000);
    for (let i = 0; i < n; i++) dots.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      r: Math.random()*1.3+0.3, dx:(Math.random()-.5)*.15, dy:(Math.random()-.5)*.15
    });
  }
  initDots(); addEventListener('resize', initDots);
  const noMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function animateDots() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let d of dots) {
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,0,0,0.6)'; ctx.fill();
      d.x+=d.dx; d.y+=d.dy;
      if(d.x<0)d.x=canvas.width; if(d.x>canvas.width)d.x=0;
      if(d.y<0)d.y=canvas.height; if(d.y>canvas.height)d.y=0;
    }
    requestAnimationFrame(animateDots);
  }
  if (!noMotion) animateDots();
  else for (let d of dots) { ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fillStyle='rgba(255,0,0,0.6)'; ctx.fill(); }

  function isHolidayWindow() {
    const now = new Date();
    return now.getMonth() === 6 && now.getDate() === 4;
  }
  const balloonsWrapEl = document.querySelector('.balloons-wrap');
  const fwCanvasEl = document.getElementById('fireworks');
  const holidayActive = isHolidayWindow();
  if (!holidayActive) {
    if (balloonsWrapEl) balloonsWrapEl.style.display = 'none';
    if (fwCanvasEl) fwCanvasEl.style.display = 'none';
  }

  (function fireworksInit() {
    const fwCanvas = document.getElementById('fireworks');
    if (!fwCanvas || noMotion || !holidayActive) return;
    const fwCtx = fwCanvas.getContext('2d');
    function fwResize() { fwCanvas.width = innerWidth; fwCanvas.height = innerHeight; }
    fwResize(); addEventListener('resize', fwResize);

    const FW_COLORS = ['#ff2b2b','#ff5c5c','#ffffff','#ffe5e5','#ff0000'];
    let particles = [];
    let rockets = [];

    function spawnRocket() {
      const targetX = innerWidth * (0.06 + Math.random()*0.88);
      const targetY = innerHeight * (0.1 + Math.random()*0.4);
      rockets.push({
        x: targetX, y: innerHeight + 20,
        targetY, vy: -(Math.random()*3 + 6),
        color: FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)]
      });
    }

    function explode(x, y, color) {
      const count = 40 + Math.floor(Math.random()*20);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random()*0.2;
        const speed = Math.random()*3.2 + 1.2;
        particles.push({
          x, y,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed,
          life: 1,
          decay: Math.random()*0.012 + 0.012,
          color
        });
      }
    }

    function fwTick() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      rockets.forEach(r => { r.y += r.vy; });
      rockets = rockets.filter(r => {
        fwCtx.beginPath();
        fwCtx.arc(r.x, r.y, 2.4, 0, Math.PI*2);
        fwCtx.fillStyle = r.color;
        fwCtx.fill();
        if (r.y <= r.targetY) { explode(r.x, r.y, r.color); return false; }
        return true;
      });

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.035;
        p.life -= p.decay;
      });
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        fwCtx.globalAlpha = Math.max(p.life, 0);
        fwCtx.beginPath();
        fwCtx.arc(p.x, p.y, 2, 0, Math.PI*2);
        fwCtx.fillStyle = p.color;
        fwCtx.fill();
      });
      fwCtx.globalAlpha = 1;

      requestAnimationFrame(fwTick);
    }

    function scheduleRocket() {
      spawnRocket();
      if (Math.random() < 0.4) spawnRocket();
      setTimeout(scheduleRocket, 400 + Math.random()*700);
    }

    scheduleRocket();
    fwTick();
  })();

  const params = new URLSearchParams(window.location.search);
  const file = (params.get('f') || '').trim();
  const title = params.get('title');
  const card = document.getElementById('card');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const ICON_DL   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>';
  const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>';
  const ICON_ERR  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5zM14 3v5h5"/></svg>';

  const IMAGES = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'bmp'];
  const VIDEOS = ['mp4', 'webm', 'mov', 'm4v'];
  function fileKind(ext) {
    if (IMAGES.includes(ext)) return 'Изображение';
    if (VIDEOS.includes(ext)) return 'Видео';
    if (['zip', 'rar', '7z'].includes(ext)) return 'Архив';
    if (['psd', 'ai', 'fig', 'svg'].includes(ext)) return 'Исходник';
    return 'Файл';
  }

  // ссылка не должна выходить за папку с работами
  const invalid = !file || file.split('/').some(p => p === '..' || p === '.');

  if (invalid) {
    card.innerHTML = `
      <div class="card-head">
        <h1 class="title">${file ? 'Неверная ссылка' : 'Файл не указан'}</h1>
      </div>
      <div class="icon">${ICON_ERR}</div>
      <div class="card-body">
        <div class="error">Ссылка неполная.<br>Попросите отправителя прислать её ещё раз.</div>
        <a class="home-btn" href="/mezets.design/">${ICON_HOME}На главную</a>
      </div>
    `;
  } else {
    const fileUrl = '/mezets.design/raboti/' + encodeURIComponent(file).replace(/%2F/g, '/');
    let displayName = file;
    if (title) { try { displayName = decodeURIComponent(title); } catch (e) { displayName = title; } }
    const dot = file.lastIndexOf('.');
    const ext = dot > -1 ? file.slice(dot + 1).toLowerCase() : '';
    const kind = fileKind(ext);

    let previewHtml;
    if (IMAGES.includes(ext)) previewHtml = `<img src="${fileUrl}" alt="">`;
    else if (VIDEOS.includes(ext)) previewHtml = `<video src="${fileUrl}" controls muted playsinline preload="metadata"></video>`;
    else previewHtml = `<div class="big-icon">${ICON_FILE}</div>`;

    card.innerHTML = `
      <div class="card-head">
        <h1 class="title">Ваша работа готова</h1>
        <div class="meta">
          ${ext ? `<span class="chip accent">${esc(ext.toUpperCase())}</span>` : ''}
          <span class="chip">${esc(kind)}</span>
          <button class="chip" type="button" id="copyLinkBtn">Скопировать ссылку</button>
        </div>
      </div>
      <div class="preview" id="previewBox">${previewHtml}</div>
      <div class="card-body">
        <div class="filename">${esc(displayName)}</div>
        <a class="btn" href="${fileUrl}" download>${ICON_DL}Скачать</a>
        <a class="home-btn" href="/mezets.design/">${ICON_HOME}На главную</a>
      </div>
    `;

    // если превью не загрузилось — показываем иконку файла вместо пустого поля
    const media = card.querySelector('#previewBox img, #previewBox video');
    if (media) media.addEventListener('error', () => {
      const box = document.getElementById('previewBox');
      if (box) box.innerHTML = `<div class="big-icon">${ICON_FILE}</div>`;
    });

    const copyBtn = document.getElementById('copyLinkBtn');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        copyBtn.textContent = 'Скопировано ✓';
        copyBtn.classList.add('done');
      } catch (e) {
        copyBtn.textContent = 'Не удалось скопировать';
      }
      setTimeout(() => { copyBtn.textContent = 'Скопировать ссылку'; copyBtn.classList.remove('done'); }, 2200);
    });
  }

  // курсор: точка + кольцо (только мышь)
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    const root = document.documentElement;
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dot = document.createElement('div'); dot.className = 'cur-dot';
    const ring = document.createElement('div'); ring.className = 'cur-ring';
    document.body.append(ring, dot);
    const INTERACTIVE = 'a, button, label, .btn, .home-btn, .chip, video';
    let x = -100, y = -100, rx = -100, ry = -100, raf = 0, armed = false;
    function loop() {
      const k = calm ? 1 : 0.18;
      rx += (x - rx) * k; ry += (y - ry) * k;
      ring.style.transform = 'translate3d(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px,0)';
      raf = (Math.abs(x - rx) > 0.1 || Math.abs(y - ry) > 0.1) ? requestAnimationFrame(loop) : 0;
    }
    addEventListener('pointermove', (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      if (!armed) { armed = true; rx = x = e.clientX; ry = y = e.clientY; root.classList.add('has-cursor'); }
      x = e.clientX; y = e.clientY;
      dot.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      root.classList.add('cur-on');
      const t = e.target;
      root.classList.toggle('cur-hover', !!(t.closest && t.closest(INTERACTIVE)));
      root.classList.toggle('cur-text', !!(t.closest && t.closest('input, textarea')));
      if (!raf) raf = requestAnimationFrame(loop);
    }, { passive: true });
    addEventListener('pointerdown', () => root.classList.add('cur-down'));
    addEventListener('pointerup', () => root.classList.remove('cur-down'));
    document.addEventListener('mouseleave', () => root.classList.remove('cur-on'));
  })();
</script>

</body>
