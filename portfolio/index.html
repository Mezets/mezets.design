    return null;
  }
  function cacheWrite(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }

  /* ── фильтры ── */
  function shortType(t) {
    t = (t || '').toLowerCase();
    if (t.indexOf('вк') !== -1 || t.indexOf('vk') !== -1) return 'ВК';
    if (t.indexOf('аватар') !== -1) return 'Аватарки';
    if (t.indexOf('discord') !== -1 || t.indexOf('дискорд') !== -1) return 'Discord';
    if (t.indexOf('youtube') !== -1 || t.indexOf('превью') !== -1) return 'YouTube';
    if (t.indexOf('twitch') !== -1) return 'Twitch';
    if (t.indexOf('бот') !== -1) return 'Боты';
    if (t.indexOf('раздел') !== -1 && t.indexOf('аккаунт') === -1) return 'Форумные разделы';
    if (t.indexOf('аним') !== -1 && t.indexOf('форум') !== -1) return 'Форум · анимация';
    if (t.indexOf('форум') !== -1) return 'Форум';
    return 'Другое';
  }
  function renderChips() {
    var counts = {}, order = [];
    entries.forEach(function (g) { var k = shortType(g[0].type); if (!counts[k]) { counts[k] = 0; order.push(k); } counts[k]++; });
    var box = document.getElementById('chips');
    box.innerHTML = '';
    function mk(label, val, n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (filterType === val ? ' on' : '');
      b.textContent = label + (n != null ? ' ' + n : '');
      b.onclick = function () { filterType = val; renderChips(); renderGrid(); };
      box.appendChild(b);
    }
    mk('Все', '', entries.length);
    order.forEach(function (k) { mk(k, k, counts[k]); });
  }

  /* ── сетка ── */
  var vidObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function (list) {
    list.forEach(function (e) {
      var v = e.target;
      if (e.isIntersecting && !v.src) { v.src = v.dataset.src; v.load(); vidObserver.unobserve(v); }
    });
  }, { rootMargin: '300px' }) : null;

  function makeMedia(item) {
    var url = mediaUrl(item.img);
    if (isVideo(item.img)) {
      var v = document.createElement('video');
      v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
      v.dataset.src = url + '#t=0.1';
      if (vidObserver) vidObserver.observe(v); else v.src = v.dataset.src;
      return v;
    }
    var im = document.createElement('img');
    im.src = url; im.alt = item.type; im.loading = 'lazy';
    return im;
  }

  function stars(n) { n = n || 0; return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n)); }

  function renderGrid() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var q = query.trim().toLowerCase();
    var shown = 0;
    entries.forEach(function (items, idx) {
      var cover = items[0];
      if (filterType && shortType(cover.type) !== filterType) return;
      if (q) {
        var hay = (cover.type + ' ' + cover.time + ' ' + items.map(function (i) { return i.author ? i.author.name : ''; }).join(' ')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      shown++;
      var card = document.createElement('div');
      card.className = 'vcard';
      card.style.animationDelay = Math.min(shown, 12) * 0.03 + 's';

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.appendChild(makeMedia(cover));
      if (isVideo(cover.img)) { var pl = document.createElement('div'); pl.className = 'tplay'; pl.textContent = '▶'; thumb.appendChild(pl); }
      if (items.length > 1) { var b = document.createElement('div'); b.className = 'tbadge'; b.textContent = '1/' + items.length; thumb.appendChild(b); }
      if (items.some(function (i) { return i.isNew; })) { var nw = document.createElement('div'); nw.className = 'tnew'; nw.textContent = 'НОВОЕ'; thumb.appendChild(nw); }
      card.appendChild(thumb);

      var meta = document.createElement('div'); meta.className = 'vmeta';
      var ava = document.createElement('div'); ava.className = 'vava';
      var au = items.find(function (i) { return i.author && i.author.name; });
      var rv = items.find(function (i) { return i.review && (i.review.rating || i.review.comment); });
      if (au && au.author.avatar) { var ai = document.createElement('img'); ai.src = au.author.avatar; ai.alt = ''; ava.appendChild(ai); }
      else ava.textContent = au ? au.author.name.charAt(0).toUpperCase() : 'M';
      var tx = document.createElement('div'); tx.className = 'vtext';
      var tt = document.createElement('div'); tt.className = 'vtitle'; tt.textContent = cover.type;
      var sb = document.createElement('div'); sb.className = 'vsub';
      var parts = [];
      if (au) parts.push('Заказал: ' + au.author.name);
      if (cover.time) parts.push(cover.time);
      sb.textContent = parts.join(' · ');
      if (rv) { var st = document.createElement('span'); st.className = 'stars'; st.textContent = ' ' + stars(rv.review.rating); sb.appendChild(st); }
      tx.append(tt, sb);
      meta.append(ava, tx);
      card.appendChild(meta);

      card.addEventListener('mouseenter', function () { var v = thumb.querySelector('video'); if (v && v.src) v.play().catch(function () {}); });
      card.addEventListener('mouseleave', function () { var v = thumb.querySelector('video'); if (v) { v.pause(); v.currentTime = 0.1; } });
      card.addEventListener('click', function () { openModal(items); });
      grid.appendChild(card);
    });
    if (!shown) {
      var em = document.createElement('div'); em.className = 'empty';
      em.innerHTML = 'Ничего не нашлось.<br>Попробуй другое слово или выбери «Все».';
      grid.appendChild(em);
    }
    document.getElementById('pageSub').textContent = 'Работ: ' + entries.length + ' · Оформление вручную';
  }

  /* ── окно просмотра ── */
  var cur = [], ci = 0;
  var modal = document.getElementById('modal');
  function openModal(items) { cur = items; ci = 0; showSlide(); modal.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeModal() {
    modal.classList.remove('open'); document.body.style.overflow = '';
    var v = document.querySelector('#mmedia video'); if (v) v.pause();
  }
  function showSlide() {
    var it = cur[ci];
    var wrap = document.getElementById('mmedia');
    Array.prototype.slice.call(wrap.querySelectorAll('img,video')).forEach(function (n) { n.remove(); });
    var url = mediaUrl(it.img), el;
    if (isVideo(it.img)) { el = document.createElement('video'); el.src = url; el.controls = true; el.autoplay = true; el.loop = true; el.playsInline = true; }
    else { el = document.createElement('img'); el.src = url; el.alt = it.type; }
    wrap.insertBefore(el, wrap.firstChild);

    document.getElementById('mtype').textContent = it.type;
    document.getElementById('mtime').textContent = it.time ? 'Срок выполнения: ' + it.time : '';

    var ae = document.getElementById('mauthor'); ae.textContent = '';
    if (it.author && it.author.name) {
      var l = document.createElement('span'); l.textContent = 'Заказал:'; ae.appendChild(l);
      if (it.author.avatar) { var av = document.createElement('img'); av.src = it.author.avatar; av.alt = ''; ae.appendChild(av); }
      var nm = document.createElement('b'); nm.textContent = it.author.name; ae.appendChild(nm);
    }

    var re = document.getElementById('mreview'); re.textContent = '';
    var rv = it.review;
    if (rv && (rv.comment || rv.rating)) {
      var h = document.createElement('div'); h.className = 'rhead';
      if (rv.avatar) { var ra = document.createElement('img'); ra.src = rv.avatar; ra.alt = ''; h.appendChild(ra); }
      var who = document.createElement('span'); who.className = 'rauth'; who.textContent = rv.author || 'Аноним'; h.appendChild(who);
      var sr = document.createElement('span'); sr.className = 'rstars'; sr.textContent = stars(rv.rating); h.appendChild(sr);
      re.appendChild(h);
      var mt = [rv.date, rv.order ? 'Заказ ' + rv.order : '', rv.order_type].filter(Boolean).join(' · ');
      if (mt) { var m = document.createElement('div'); m.className = 'rmeta'; m.textContent = mt; re.appendChild(m); }
      if (rv.comment) { var t = document.createElement('div'); t.className = 'rtext'; t.textContent = rv.comment; re.appendChild(t); }
    }

    var multi = cur.length > 1;
    document.getElementById('mprev').style.display = multi ? 'flex' : 'none';
    document.getElementById('mnext').style.display = multi ? 'flex' : 'none';
    var dots = document.getElementById('mdots'); dots.innerHTML = '';
    if (multi) cur.forEach(function (_, i) {
      var d = document.createElement('span'); if (i === ci) d.className = 'on';
      d.onclick = function () { ci = i; showSlide(); }; dots.appendChild(d);
    });
  }
  function step(d) { if (cur.length > 1) { ci = (ci + d + cur.length) % cur.length; showSlide(); } }
  document.getElementById('mclose').onclick = closeModal;
  document.getElementById('mprev').onclick = function () { step(-1); };
  document.getElementById('mnext').onclick = function () { step(1); };
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  document.getElementById('search').addEventListener('input', function (e) { query = e.target.value; renderGrid(); });

  /* ── плашка про VPN ── */
  var vpnOff = false;
  document.getElementById('vpnClose').onclick = function () { vpnOff = true; document.getElementById('vpnBanner').classList.remove('show'); };
  function vpn(on) { if (on && vpnOff) return; document.getElementById('vpnBanner').classList.toggle('show', on); }

  /* ── загрузка ── */
  function sig(list) { return JSON.stringify(list.map(function (g) { return g.map(function (i) { return [i.img, i.type, i.time, i.isNew, i.author && i.author.name, i.review && [i.review.author, i.review.rating, i.review.comment]]; }); })); }

  function setEntries(list) {
    if (sig(list) === sig(entries)) return;
    entries = list;
    if (filterType && !entries.some(function (g) { return shortType(g[0].type) === filterType; })) filterType = '';
    renderChips(); renderGrid();
  }

  var cached = cacheRead();
  setEntries(cached ? buildEntries(cached) : buildFromFallback(FALLBACK));

  (function load() {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 8000);
    fetch(API + '/api/portfolio', { mode: 'cors', signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        clearTimeout(timer);
        vpn(false);
        if (!Array.isArray(data.items) || !data.items.length) return;
        cacheWrite(data.items);
        setEntries(buildEntries(data.items));
      })
      .catch(function () { clearTimeout(timer); vpn(true); });
  })();
</script>
</body>
</html>
