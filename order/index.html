<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezets — Чат заказа</title>
<link rel="icon" type="image/png" href="/mezets.design/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-width: thin; scrollbar-color: rgba(255,0,0,0.45) rgba(10,0,0,0.6); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: rgba(10,0,0,0.6); }
::-webkit-scrollbar-thumb { background: rgba(255,0,0,0.45); border-radius: 6px; }
html, body {
  font-family: 'Press Start 2P', monospace;
  background: #050000; min-height: 100vh;
  color: rgba(255,200,200,0.85); overflow-x: hidden;
}
.canvas-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.wrap {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto; padding: 48px 20px 100px;
  perspective: 1200px;
}
.chat-layout {
  display: flex; gap: 20px; align-items: center;
}
.chat-layout-sidebar { width: 320px; flex-shrink: 0; order: 1; }
.chat-layout-main { flex: 1; min-width: 0; order: 2; }
@media (max-width: 700px) {
  .chat-layout-sidebar { width: 260px; }
}
@media (max-width: 480px) {
  .chat-layout { flex-direction: column; }
  .chat-layout-sidebar { width: 100%; order: 1; }
  .chat-layout-main { order: 2; }
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.logo {
  font-size: 13px;
  color: #ff2a2a;
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-shadow: 0 0 18px rgba(255,0,0,0.55);
}
.logo-sub {
  font-size: 7px;
  color: rgba(255,200,200,0.35);
  letter-spacing: 1px;
  margin-bottom: 40px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; font-family: 'Press Start 2P', monospace;
  font-size: 8px; line-height: 1.6; cursor: pointer; text-decoration: none;
  color: #ff3b3b; border-radius: 10px;
  background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.25);
  transition: .2s; letter-spacing: .5px;
}
.btn:hover { transform: scale(1.04); border-color: rgba(255,0,0,0.5); box-shadow: 0 0 24px rgba(255,0,0,0.2); }
.btn-sm { padding: 8px 12px; font-size: 7px; }
.btn-danger { background: rgba(255,0,0,0.15); border-color: rgba(255,0,0,0.4); }

.card {
  background: rgba(12,0,0,0.82);
  border: 1px solid rgba(255,0,0,0.2);
  border-radius: 18px; padding: 20px; margin-bottom: 16px;

  transform-style: preserve-3d;
  will-change: transform;
  cursor: default;
}
.card:hover { border-color: rgba(255,0,0,0.4); box-shadow: 0 0 56px rgba(255,0,0,0.2); }

.order-info {
  display: flex; flex-wrap: nowrap; gap: 16px;
  justify-content: space-between; align-items: flex-start;
}
.order-info > div:last-child {
  flex: 0 0 110px; text-align: right;
}
.order-info > div:last-child .order-price,
.order-info > div:last-child .order-status-badge { display: block; width: 100%; text-align: center; }

.order-info-left { display: flex; flex-direction: column; gap: 6px; }
.order-id { font-size: 11px; color: #ff2a2a; letter-spacing: 1px; }
.order-meta { font-size: 7px; color: rgba(255,200,200,0.5); }
.order-price { font-size: 13px; color: #ff5555; }
.status-new { color: #59bfff; }
.status-in_progress { color: #ffcc00; }
.status-completed { color: #66ff99; }
.status-cancelled { color: #ff6666; }
.order-status-badge {
  font-size: 8px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid currentColor;
}
.order-desc-box {
  margin-top: 12px; padding: 12px; border-radius: 10px;

  font-size: 7px; color: rgba(255,200,200,0.6); line-height: 1.8;
  word-break: break-word;

}
.order-desc-row {

.order-desc-row-label { color: rgba(255,80,80,0.8); flex-shrink: 0; white-space: nowrap; }

.order-desc-items { display: flex; flex-direction: column; gap: 4px; }
.order-desc-item { position: relative; padding-left: 10px; }
.order-desc-item::before { content: ''; position: absolute; left: 0; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,80,80,0.6); }

.order-cat-carousel { display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; }
.order-cat-viewport {

.order-cat-track { display: flex; align-items: stretch; transition: transform .3s cubic-bezier(.22,.61,.36,1); }
.order-cat-panel { flex-shrink: 0; padding: 8px; overflow-y: auto; box-sizing: border-box; max-height: 150px; }
.order-cat-panel-title {
  font-size: 6px; color: rgba(255,200,200,0.4); letter-spacing: 1px;

}
.order-cat-list { display: flex; flex-direction: column; gap: 4px; }
.order-cat-arrow {

.order-cat-dots { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }

.order-item-cb {

.order-label {

.status {

.status.ok { display: block; color: rgba(120,255,120,0.85); background: rgba(0,255,0,0.06); border: 1px solid rgba(0,255,0,0.2); }
.status.err { display: block; color: rgba(255,120,120,0.9); background: rgba(255,0,0,0.06); border: 1px solid rgba(255,0,0,0.25); }
.status.info { display: block; color: rgba(255,200,200,0.6); background: rgba(255,0,0,0.04); border: 1px solid rgba(255,0,0,0.15); }

.loader {
  width: 28px; height: 28px; border: 3px solid rgba(255,40,40,0.2);
  border-top-color: #ff3b3b; border-radius: 50%;
  animation: lgSpin .8s linear infinite; margin: 60px auto;
}
@keyframes lgSpin { to { transform: rotate(360deg); } }

.fluff-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.fluff { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.2; }
.fluff-1 {
  width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,0,0,0.8), transparent 70%);

.fluff-2 {

@keyframes moveFluff1 { 0% { transform: translate(5vw, 10vh); } 50% { transform: translate(55vw, 50vh); } 100% { transform: translate(5vw, 10vh); } }
@keyframes moveFluff2 { 0% { transform: translate(70vw, 70vh); } 50% { transform: translate(10vw, 40vh); } 100% { transform: translate(70vw, 70vh); } }

.empty-chat { font-size: 8px; color: rgba(255,200,200,0.3); text-align: center; padding: 60px 20px; }
</style>
</head>

<script>
checkSiteBanOnLoad();
checkMaintenance();

const API = BAN_API; // из common.js
let orderId = null;
let currentUser = null;
let CURRENT_ORDER = null;
let pollTimer = null;

function getSession() {
  try { return localStorage.getItem('mezets_session') || ''; } catch(e) { return ''; }
}

function g(name) { return document.getElementById(name); }

async function init() {
  const params = new URLSearchParams(window.location.search);
  orderId = params.get('id');
  if (!orderId) { showNotFound(); return; }

  const session = getSession();
  if (!session) { window.location.href = '/mezets.design/'; return; }

  try {
    const rMe = await fetch(`${API}/api/me?session=${encodeURIComponent(session)}`);
    if (!rMe.ok) { window.location.href = '/mezets.design/'; return; }
    const dMe = await rMe.json();
    currentUser = dMe.user;
  } catch(e) { window.location.href = '/mezets.design/'; return; }

  await loadOrder();

  // Точки как в админке
  const dotCanvas = g('matrixCanvas');
  const dotCtx = dotCanvas.getContext('2d');
  function resizeDots() { dotCanvas.width = innerWidth; dotCanvas.height = innerHeight; }
  resizeDots();
  let dots = [];
  function initDots() {
    dots = [];
    const n = Math.round((innerWidth * innerHeight) / 12000);
    for (let i = 0; i < n; i++) dots.push({
      x: Math.random()*dotCanvas.width, y: Math.random()*dotCanvas.height,
      r: Math.random()*1.2+0.3, dx:(Math.random()-.5)*.12, dy:(Math.random()-.5)*.12
    });
  }
  initDots();
  window.addEventListener('resize', () => { resizeDots(); initDots(); });
  (function animateDots() {
    dotCtx.clearRect(0,0,dotCanvas.width,dotCanvas.height);
    for (let d of dots) {
      dotCtx.beginPath(); dotCtx.arc(d.x,d.y,d.r,0,Math.PI*2);
      dotCtx.fillStyle='rgba(255,0,0,0.5)'; dotCtx.fill();
      d.x+=d.dx; d.y+=d.dy;
      if(d.x<0)d.x=dotCanvas.width; if(d.x>dotCanvas.width)d.x=0;
      if(d.y<0)d.y=dotCanvas.height; if(d.y>dotCanvas.height)d.y=0;
    }
    requestAnimationFrame(animateDots);
  })();
}

async function loadOrder() {
  const session = getSession();
  try {
    const r = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
    if (!r.ok) { showNotFound(); return; }
    const d = await r.json();
    renderOrder(d.order, d.messages || [], d.attachments || []);
    startPolling();
  } catch(e) { showNotFound(); }
}

function showNotFound() {
  g('loadingState').style.display = 'none';
  g('notFound').style.display = 'block';
}

const CATEGORY_LABELS = {
  'design': 'Дизайн', 'discord_bot': 'Discord бот', 'telegram_bot': 'Telegram бот',
  'website': 'Сайт', 'other': 'Другое',
};
const PAYMENT_LABELS = {
  'sbp': 'СБП', 'card': 'Карта', 'steam_gift': 'Подарок Steam', 'steam_topup': 'Пополнение Steam',
};

function parseDescription(description) {
  const cleanDesc = (description || '')
    .replace(/\s+(Банк:\s*)/i, '\n$1')
    .replace(/\s+(Выбрано:\s*)/i, '\n$1')
    .replace(/^\s+|\s+$/g, '');
  const lines = cleanDesc.split('\n').map(l => l.trim()).filter(Boolean);
  const freeLines = [];
  const fieldLines = [];
  lines.forEach(line => {
    const m = line.match(/^([^:]{1,30}):\s*(.+)$/);
    if (m) fieldLines.push(m); else freeLines.push(line);
  });
  const getField = name => {
    const f = fieldLines.find(([, label]) => label.trim().toLowerCase() === name);
    return f ? f[2] : '';
  };
  return {
    task: freeLines.join('\n'),
    bank: getField('банк'),
    selected: getField('выбрано'),
    fieldLines,
    freeLines,
  };
}

function renderDescView(order) {
  const parsed = parseDescription(order.description);
  let html = '';
  if (parsed.freeLines.length) {
    html += `<div class="order-desc-row"><span class="order-desc-row-label">Что нужно:</span><span class="order-desc-row-value">${escapeHtml(parsed.task)}</span></div>`;
  }
  if (order.payment_method) {
    const payLabel = PAYMENT_LABELS[order.payment_method] || order.payment_method;
    html += `<div class="order-desc-row"><span class="order-desc-row-label">Способ оплаты:</span><span class="order-desc-row-value">${escapeHtml(payLabel)}</span></div>`;
  }
  parsed.fieldLines.forEach(([, label, value]) => {
    const cleanLabel = label.trim().toLowerCase();
    if (cleanLabel === 'выбрано') {
      const items = value.split(',').map(v => v.trim()).filter(Boolean);
      const itemsHtml = items.map(item => `<div class="order-desc-item">${escapeHtml(item)}</div>`).join('');
      html += `<div class="order-desc-row"><span class="order-desc-row-label">${escapeHtml(label)}:</span><div class="order-desc-row-value order-desc-items">${itemsHtml}</div></div>`;
    } else {
      html += `<div class="order-desc-row"><span class="order-desc-row-label">${escapeHtml(label)}:</span><span class="order-desc-row-value">${escapeHtml(value)}</span></div>`;
    }
  });
  g('orderDescBox').innerHTML = html || escapeHtml(order.description || '');
}

function renderOrder(order, messages, attachments) {
  g('loadingState').style.display = 'none';
  g('chatContent').style.display = 'flex';

  const statusLabels = { 'new': 'Новый', 'in_progress': 'В работе', 'completed': 'Выполнен', 'cancelled': 'Отменён' };
  g('orderIdDisplay').textContent = `Заказ #${order.id}`;
  document.title = `Mezets - Чат заказа #${order.id}`;
  g('orderMeta').textContent = `${CATEGORY_LABELS[order.category] || order.category || ''} · ${order.created_at ? order.created_at.slice(0, 10) : ''}`;
  g('orderPrice').textContent = order.estimated_price ? `${order.estimated_price} ₽` : '';
  const badge = g('orderStatusBadge');
  badge.textContent = statusLabels[order.status] || order.status;
  badge.className = 'order-status-badge status-' + order.status;
  CURRENT_ORDER = order;
  renderDescView(order);

  const closeBtn = g('closeOrderBtn');
  if (closeBtn) {
    closeBtn.style.display = (order.status === 'completed' || order.status === 'cancelled') ? 'none' : 'inline-flex';
  }
  const editBtn = g('editOrderBtn');
  if (editBtn) {
    editBtn.style.display = (order.status === 'completed' || order.status === 'cancelled') ? 'none' : 'inline-flex';
  }

  renderMessages(messages, attachments);
}

let EDITING_ORDER = false;
let editCatIndex = 0;
let editCatCount = 0;
let editPriceSections = null;

const BANK_OPTIONS = ['Т-Банк', 'Сбербанк', 'Альфа-Банк', 'ВТБ', 'Райффайзен', 'Газпромбанк', 'Озон Банк', 'Другой'];

function parsePriceNumber(str) {
  if (!str) return 0;
  const digits = String(str).replace(/[^\d]/g, '');
  return digits ? parseInt(digits, 10) : 0;
}

function parseSelectedItems(selected) {
  // "Аватарка, Обложка × 2" -> { "Аватарка": 1, "Обложка": 2 }
  const map = {};
  (selected || '').split(',').map(s => s.trim()).filter(Boolean).forEach(entry => {
    const m = entry.match(/^(.*?)(?:\s*×\s*(\d+))?$/);
    if (!m) return;
    const name = m[1].trim();
    const qty = m[2] ? parseInt(m[2], 10) : 1;
    if (name) map[name] = (map[name] || 0) + qty;
  });
  return map;
}

async function loadEditPriceSections() {
  if (editPriceSections) return editPriceSections;
  try {
    const r = await fetch(`${API}/api/prices`);
    const d = await r.json();
    editPriceSections = d.sections || [];
  } catch(e) {
    editPriceSections = [];
  }
  return editPriceSections;
}

function renderEditItemsCarouselHTML(sections, selectedMap) {
  if (!sections || sections.length === 0) {
    return '<div style="font-size:6px;color:rgba(255,200,200,0.4)">Не удалось загрузить услуги</div>';
  }
  editCatIndex = 0;
  editCatCount = sections.length;
  let html = '<div class="order-cat-carousel">';
  html += '<button type="button" class="order-cat-arrow" onclick="scrollEditCategory(-1)">‹</button>';
  html += `<div class="order-cat-viewport"><div class="order-cat-track" id="editCatTrack" style="width:${sections.length * 100}%">`;
  sections.forEach(sec => {
    html += `<div class="order-cat-panel" style="width:${100 / sections.length}%">`;
    html += `<div class="order-cat-panel-title">${escapeHtml(sec.label)}</div>`;
    html += '<div class="order-cat-list">';
    sec.items.forEach(item => {
      const isNegotiable = /договор/i.test(item.price);
      const qty = selectedMap[item.name] || 0;
      html += '<div class="order-item-cb">' +
        '<span style="flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px">' +
          `<span>${escapeHtml(item.name)}</span>` +
          `<span style="opacity:0.5">${escapeHtml(item.price)}</span>` +
        '</span>' +
        '<div class="item-stepper">' +
          '<button type="button" class="item-stepper-btn" onclick="stepEditItemQty(this,-1)">−</button>' +
          `<input type="text" class="item-qty" readonly value="${qty}" data-price="${escapeHtml(item.price)}" data-name="${escapeHtml(item.name)}" data-negotiable="${isNegotiable ? '1' : '0'}">` +
          '<button type="button" class="item-stepper-btn" onclick="stepEditItemQty(this,1)">+</button>' +
        '</div>' +
      '</div>';
    });
    html += '</div></div>';
  });
  html += '</div></div>';
  html += '<button type="button" class="order-cat-arrow" onclick="scrollEditCategory(1)">›</button>';
  html += '</div>';
  html += '<div class="order-cat-dots" id="editCatDots">';
  sections.forEach((_, i) => {
    html += `<span class="order-cat-dot${i === 0 ? ' active' : ''}" onclick="goToEditCategory(${i})"></span>`;
  });
  html += '</div>';
  return html;
}

function scrollEditCategory(dir) {
  editCatIndex = (editCatIndex + dir + editCatCount) % editCatCount;
  applyEditCategoryPosition();
}
function goToEditCategory(i) {
  editCatIndex = i;
  applyEditCategoryPosition();
}
function applyEditCategoryPosition() {
  const track = g('editCatTrack');
  if (!track) return;
  const step = editCatCount > 0 ? (100 / editCatCount) : 100;
  track.style.transform = `translateX(-${editCatIndex * step}%)`;
  document.querySelectorAll('#editCatDots .order-cat-dot').forEach((d, i) => d.classList.toggle('active', i === editCatIndex));
}

function stepEditItemQty(btn, delta) {
  const stepper = btn.parentElement;
  const input = stepper.querySelector('.item-qty');
  let val = (parseInt(input.value, 10) || 0) + delta;
  if (val < 0) val = 0;
  if (val > 99) val = 99;
  input.value = val;
  updateEditTotal();
}

function collectEditItems() {
  const items = [];
  let total = 0;
  document.querySelectorAll('#orderEditItemsBox .item-qty').forEach(inp => {
    const qty = parseInt(inp.value, 10) || 0;
    if (qty <= 0) return;
    const price = parsePriceNumber(inp.getAttribute('data-price'));
    const name = inp.getAttribute('data-name') || '';
    total += qty * price;
    items.push(qty > 1 ? `${name} × ${qty}` : name);
  });
  return { items, total };
}

function updateEditTotal() {
  const { total } = collectEditItems();
  const out = g('orderEditTotalPrice');
  if (out) out.textContent = `${total} ₽`;
  const topPrice = g('orderPrice');
  if (topPrice) topPrice.textContent = `${total} ₽`;
}

function renderDescEdit(order) {
  const parsed = parseDescription(order.description);
  const payValue = order.payment_method || 'sbp';
  const payOptions = [
    ['sbp', 'СБП'], ['card', 'Карта'], ['steam_gift', 'Подарок Steam'], ['steam_topup', 'Пополнение Steam'],
  ];
  const payHtml = payOptions.map(([val, label]) =>
    `<option value="${val}"${val === payValue ? ' selected' : ''}>${label}</option>`
  ).join('');
  const bankList = BANK_OPTIONS.includes(parsed.bank) || !parsed.bank ? BANK_OPTIONS : [parsed.bank, ...BANK_OPTIONS];
  const bankHtml = bankList.map(b => `<option value="${escapeHtml(b)}"${b === parsed.bank ? ' selected' : ''}>${escapeHtml(b)}</option>`).join('');
  g('orderDescBox').innerHTML = `
    <div class="order-label" style="margin-bottom:4px">Что нужно</div>
    <textarea id="orderEditTaskInput" class="order-textarea" style="height:56px;margin-bottom:6px" placeholder="Опиши задачу...">${escapeHtml(parsed.task)}</textarea>
    <div class="order-label" style="margin-bottom:4px">Способ оплаты</div>
    <select id="orderEditPaymentInput" class="order-select" style="margin-bottom:6px">${payHtml}</select>
    <div class="order-label" style="margin-bottom:4px">Банк</div>
    <select id="orderEditBankInput" class="order-select" style="margin-bottom:6px">${bankHtml}</select>
    <div class="order-label" style="margin-bottom:4px">Выбрано</div>
    <div id="orderEditItemsBox" style="margin-bottom:6px">
      <div style="font-size:6px;color:rgba(255,200,200,0.4)">Загружаю услуги...</div>
    </div>
    <div class="order-edit-total"><span>Итого</span><b id="orderEditTotalPrice">${order.estimated_price ? order.estimated_price : 0} ₽</b></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="saveOrderEditClient()" style="flex:1;border-color:rgba(0,200,0,0.35);color:#55ff55">💾 Сохранить</button>
      <button class="btn btn-sm" onclick="toggleOrderEdit(false)" style="flex:1">Отмена</button>
    </div>
  `;
  loadEditPriceSections().then(sections => {
    const box = g('orderEditItemsBox');
    if (!box) return;
    const selectedMap = parseSelectedItems(parsed.selected);
    box.innerHTML = renderEditItemsCarouselHTML(sections, selectedMap);
    updateEditTotal();
  });
}

function toggleOrderEdit(force) {
  if (!CURRENT_ORDER) return;
  const show = force === undefined ? !EDITING_ORDER : !!force;
  EDITING_ORDER = show;
  if (show) {
    renderDescEdit(CURRENT_ORDER);
  } else {
    renderDescView(CURRENT_ORDER);
    const topPrice = g('orderPrice');
    if (topPrice) topPrice.textContent = CURRENT_ORDER.estimated_price ? `${CURRENT_ORDER.estimated_price} ₽` : '';
    g('orderEditStatus').innerHTML = '';
  }
}

async function saveOrderEditClient() {
  if (!orderId) return;
  const status = g('orderEditStatus');
  const task = g('orderEditTaskInput').value.trim();
  const bank = g('orderEditBankInput').value.trim();
  const payment_method = g('orderEditPaymentInput').value;
  const { items, total } = collectEditItems();
  if (!task) {
    showStatus(status, 'Опиши задачу', 'err');
    return;
  }
  const parts = [task];
  if (bank) parts.push(`Банк: ${bank}`);
  if (items.length) parts.push(`Выбрано: ${items.join(', ')}`);
  const description = parts.join('\n');
  const estimated_price = total;
  const session = getSession();
  showStatus(status, 'Сохраняю...', 'info');
  try {
    const r = await fetch(`${API}/api/order/${orderId}/edit?session=${encodeURIComponent(session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description, payment_method, estimated_price }),
    });
    if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.error || 'Сервер отклонил (' + r.status + ')'); }
    EDITING_ORDER = false;
    await loadOrder();
    showStatus(g('orderEditStatus'), 'Сохранено!', 'ok');
  } catch(e) {
    showStatus(status, 'Ошибка: ' + e.message, 'err');
  }
}

function showStatus(el, text, kind) {
  if (!el) return;
  el.textContent = text;
  el.className = 'status ' + kind;
}

async function closeOrder() {
  if (!confirm('Закрыть заказ #' + orderId + '?\nПосле закрытия оформить его заново будет нельзя — только создать новый.')) return;
  const session = getSession();
  const btn = g('closeOrderBtn');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/api/order/${orderId}/close?session=${encodeURIComponent(session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    });
    if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.error || 'close failed'); }
    await loadOrder();
  } catch(e) {
    alert('Не удалось закрыть заказ: ' + e.message);
  }
  btn.disabled = false;
}

function renderMessages(messages, attachments) {
  const box = g('chatBox');
  if (!messages.length) {
    box.innerHTML = '<div class="empty-chat">Сообщений пока нет. Напиши что-нибудь!</div>';
    return;
  }
  const attMap = {};
  if (attachments) attachments.forEach(a => {
    if (a.message_id) {
      if (!attMap[a.message_id]) attMap[a.message_id] = [];
      attMap[a.message_id].push(a);
    }
  });

  function isImageFile(name, url) {
    return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i.test(name || url || '');
  }

  box.innerHTML = messages.map(m => {
    if (m.author_id === 'system') {
      return `<div class="msg msg-system"><div class="msg-text">${escapeHtml(m.content || '')}</div></div>`;
    }
    const isUser = !m.from_discord;
    const atts = attMap[m.id] || [];
    const attHtml = atts.length ? '<div class="msg-attachments">' + atts.map(a => {
      if (isImageFile(a.filename, a.discord_url)) {
        return `<a href="${a.discord_url}" target="_blank" class="msg-attachment-img"><img src="${a.discord_url}" alt="${a.filename || 'изображение'}" loading="lazy"></a>`;
      }
      return `<a href="${a.discord_url}" target="_blank" class="msg-attachment">${a.filename || 'файл'} ↓</a>`;
    }).join('') + '</div>' : '';
    const author = isUser ? (currentUser && currentUser.username ? currentUser.username : 'Вы') : m.author;
    return `<div class="msg msg-${isUser ? 'user' : 'discord'}">
      <div class="msg-author">${escapeHtml(author)}</div>
      <div class="msg-text">${escapeHtml(m.content || '')}</div>
      ${attHtml}
      <div class="msg-time">${m.created_at ? m.created_at.slice(11, 19) : ''}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function startPolling() {
  pollTimer = setInterval(async () => {
    const session = getSession();
    try {
      const r = await fetch(`${API}/api/order/${orderId}/messages?session=${encodeURIComponent(session)}`);
      if (!r.ok) return;
      const d = await r.json();
      const box = g('chatBox');
      const oldCount = box.querySelectorAll('.msg').length;
      if (d.messages && d.messages.length !== oldCount) {
        const r2 = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
        if (r2.ok) {
          const d2 = await r2.json();
          renderMessages(d2.messages || [], d2.attachments || []);
        }
      }
    } catch(e) {}
  }, 3000);
}

async function sendMsg() {
  const input = g('msgInput');
  const content = input.value.trim();
  if (!content) return;

  const session = getSession();
  input.disabled = true;

  try {
    const r = await fetch(`${API}/api/order/${orderId}/message?session=${encodeURIComponent(session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (!r.ok) throw new Error('send failed');
    input.value = '';
    // Reload immediately
    const r2 = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
    if (r2.ok) {
      const d = await r2.json();
      renderMessages(d.messages || [], d.attachments || []);
    }
  } catch(e) {
    console.error('send error:', e);
  }
  input.disabled = false;
  input.focus();
}

function uploadFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('Файл слишком большой (макс 10MB)'); return; }
    const session = getSession();
    const formData = new FormData();
    formData.append('order_id', orderId);
    formData.append('file', file);
    try {
      await fetch(`${API}/api/order/upload?session=${encodeURIComponent(session)}`, {
        method: 'POST', body: formData,
      });
      const r = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
      if (r.ok) {
        const d = await r.json();
        renderMessages(d.messages || [], d.attachments || []);
      }
    } catch(e) { console.error('upload error:', e); }
  };
  input.click();
}

function tilt(card) {
  let rafId = null;
  card.addEventListener('mousemove', e => {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width  - 0.5;
      const y = (e.clientY - r.top)  / r.height - 0.5;
      card.style.transform = `rotateY(${x*10}deg) rotateX(${-y*10}deg)`;
      rafId = null;
    });
  });
  card.addEventListener('mouseleave', () => { card.style.transform = 'rotateY(0) rotateX(0)'; });
}
document.querySelectorAll('.card').forEach(tilt);

document.addEventListener('DOMContentLoaded', init);
</script>
