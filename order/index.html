<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezets — Чат заказа</title>
<link rel="icon" type="image/png" href="/mezets.design/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-width: thin; scrollbar-color: rgba(255,0,0,0.45) rgba(10,0,0,0.6); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: rgba(10,0,0,0.6); }
::-webkit-scrollbar-thumb { background: rgba(255,0,0,0.45); border-radius: 6px; }
html, body {
  font-family: 'Press Start 2P', monospace;
  background: #050000; min-height: 100vh;
  color: rgba(255,200,200,0.85); overflow-x: hidden;
}
.canvas-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.wrap {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto; padding: 48px 20px 100px;
}
.chat-layout {
  display: flex; gap: 20px; align-items: flex-start;
}
.chat-layout-sidebar { width: 320px; flex-shrink: 0; }
.chat-layout-main { flex: 1; min-width: 0; }
@media (max-width: 760px) {
  .chat-layout { flex-direction: column; }
  .chat-layout-sidebar { width: 100%; }
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.logo {
  font-size: 13px;
  color: #ff2a2a;
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-shadow: 0 0 18px rgba(255,0,0,0.55);
}
.logo-sub {
  font-size: 7px;
  color: rgba(255,200,200,0.35);
  letter-spacing: 1px;
  margin-bottom: 40px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; font-family: 'Press Start 2P', monospace;
  font-size: 8px; line-height: 1.6; cursor: pointer; text-decoration: none;
  color: #ff3b3b; border-radius: 10px;
  background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.25);
  transition: .2s; letter-spacing: .5px;
}
.btn:hover { transform: scale(1.04); border-color: rgba(255,0,0,0.5); box-shadow: 0 0 24px rgba(255,0,0,0.2); }
.btn-sm { padding: 8px 12px; font-size: 7px; }
.btn-danger { background: rgba(255,0,0,0.15); border-color: rgba(255,0,0,0.4); }

.card {
  background: rgba(12,0,0,0.82);
  border: 1px solid rgba(255,0,0,0.2);
  border-radius: 18px; padding: 20px; margin-bottom: 16px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(255,0,0,0.06);
}

.order-info {
  display: flex; flex-wrap: nowrap; gap: 16px;
  justify-content: space-between; align-items: flex-start;
}
.order-info > div:last-child {
  flex: 0 0 110px; text-align: right;
}
.order-info > div:last-child .order-price,
.order-info > div:last-child .order-status-badge { display: block; width: 100%; text-align: center; }

.order-info-left { display: flex; flex-direction: column; gap: 6px; }
.order-id { font-size: 11px; color: #ff2a2a; letter-spacing: 1px; }
.order-meta { font-size: 7px; color: rgba(255,200,200,0.5); }
.order-price { font-size: 13px; color: #ff5555; }
.status-new { color: #59bfff; }
.status-in_progress { color: #ffcc00; }
.status-completed { color: #66ff99; }
.status-cancelled { color: #ff6666; }
.order-status-badge {
  font-size: 8px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid currentColor;
}
.order-desc-box {
  margin-top: 12px; padding: 12px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,0,0,0.1);
  font-size: 7px; color: rgba(255,200,200,0.6); line-height: 1.8;
  word-break: break-word;
  white-space: pre-wrap;
}

.chat-box {
  display: flex; flex-direction: column;
  height: 500px; overflow-y: auto; gap: 10px;
  padding-right: 4px; margin-bottom: 12px;
}
.msg {
  padding: 12px 14px; border-radius: 12px;
  max-width: 85%; word-break: break-word; animation: msgIn .2s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg-user {
  align-self: flex-end;
  background: rgba(255,0,0,0.08); border: 1px solid rgba(255,0,0,0.18);
}
.msg-discord {
  align-self: flex-start;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
}
.msg-author { font-size: 7px; color: rgba(255,200,200,0.5); margin-bottom: 5px; }
.msg-text { font-size: 9px; color: rgba(255,220,220,0.9); line-height: 1.7; font-family: sans-serif; }
.msg-time { font-size: 6px; color: rgba(255,150,150,0.35); margin-top: 4px; text-align: right; font-family: monospace; }
.msg-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg-attachment {
  font-size: 6px; padding: 4px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(200,200,255,0.7); text-decoration: none;
  transition: .2s;
}
.msg-attachment:hover { border-color: rgba(255,60,60,0.3); }
.msg-attachment-img {
  display: block; max-width: 220px; max-height: 220px;
  border-radius: 8px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  transition: .2s;
}
.msg-attachment-img:hover { border-color: rgba(255,60,60,0.4); transform: scale(1.02); }
.msg-attachment-img img { display: block; width: 100%; height: 100%; object-fit: cover; max-height: 220px; }

.chat-input-row {
  display: flex; gap: 8px;
}
.chat-input {
  flex: 1; padding: 12px 14px; border-radius: 10px;
  background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.2);
  color: rgba(255,220,220,0.9);
  font-family: 'Press Start 2P', monospace; font-size: 8px; line-height: 1.6;
  outline: none; transition: .2s;
}
.chat-input:focus { border-color: rgba(255,0,0,0.45); box-shadow: 0 0 14px rgba(255,0,0,0.1); }
.chat-send { padding: 10px 14px; font-size: 9px; }
.chat-file-btn { padding: 10px 12px; font-size: 9px; }

.order-label {
  font-size: 6px; color: rgba(255,200,200,0.5);
  letter-spacing: 1px; text-transform: uppercase;
}
.order-select, .order-textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.2);
  color: rgba(255,220,220,0.9);
  font-family: 'Press Start 2P', monospace; font-size: 7px; line-height: 1.6;
  outline: none; transition: .2s;
}
.order-select:focus, .order-textarea:focus { border-color: rgba(255,0,0,0.45); box-shadow: 0 0 14px rgba(255,0,0,0.1); }
.order-textarea { resize: vertical; }
.payment-option-group { display: flex; flex-direction: column; gap: 6px; }
.payment-option {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.2);
  color: rgba(255,220,220,0.9);
  font-family: 'Press Start 2P', monospace; font-size: 7px; line-height: 1.6;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; transition: .2s;
}
.payment-option:hover { border-color: rgba(255,0,0,0.45); }
.payment-option.active { background: rgba(255,0,0,0.15); border-color: rgba(255,0,0,0.5); box-shadow: 0 0 14px rgba(255,0,0,0.1); }
.payment-option input { accent-color: #ff3b3b; margin: 0; flex-shrink: 0; }

.status {
  font-size: 6px; line-height: 1.6; padding: 8px 10px;
  border-radius: 8px; display: none;
}
.status.ok { display: block; color: rgba(120,255,120,0.85); background: rgba(0,255,0,0.06); border: 1px solid rgba(0,255,0,0.2); }
.status.err { display: block; color: rgba(255,120,120,0.9); background: rgba(255,0,0,0.06); border: 1px solid rgba(255,0,0,0.25); }
.status.info { display: block; color: rgba(255,200,200,0.6); background: rgba(255,0,0,0.04); border: 1px solid rgba(255,0,0,0.15); }

.loader {
  width: 28px; height: 28px; border: 3px solid rgba(255,40,40,0.2);
  border-top-color: #ff3b3b; border-radius: 50%;
  animation: lgSpin .8s linear infinite; margin: 60px auto;
}
@keyframes lgSpin { to { transform: rotate(360deg); } }

.fluff-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.fluff { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.2; }
.fluff-1 {
  width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,0,0,0.8), transparent 70%);
  animation: moveFluff1 18s ease-in-out infinite;
}
.fluff-2 {
  width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,60,0,0.6), transparent 70%);
  animation: moveFluff2 12s ease-in-out infinite; opacity: 0.12;
}
@keyframes moveFluff1 { 0% { transform: translate(5vw, 10vh); } 50% { transform: translate(55vw, 50vh); } 100% { transform: translate(5vw, 10vh); } }
@keyframes moveFluff2 { 0% { transform: translate(70vw, 70vh); } 50% { transform: translate(10vw, 40vh); } 100% { transform: translate(70vw, 70vh); } }

.empty-chat { font-size: 8px; color: rgba(255,200,200,0.3); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<div id="banOverlay" style="display:none;position:fixed;inset:0;z-index:999999;background:radial-gradient(ellipse at center,#2a0000 0%,#050000 75%);color:#fff;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:24px;">
  <div style="font-size:64px;line-height:1;margin-bottom:18px;">🚫</div>
  <div style="font-size:28px;font-weight:800;margin-bottom:10px;">Вы забанены</div>
  <div style="font-size:16px;color:#c99;max-width:420px;">Вам тут не рады. Доступ закрыт.</div>
  <div id="banReasonLine" style="font-size:13px;color:#e88;max-width:420px;margin-top:14px;display:none;"></div>
</div>
<audio id="banSound" src="../ban.mp3" preload="auto"></audio>

<div id="loadingGate" style="position:fixed;inset:0;z-index:999995;background:#050000;display:flex;align-items:center;justify-content:center;">
  <div style="width:38px;height:38px;border:3px solid rgba(255,40,40,0.2);border-top-color:#ff3b3b;border-radius:50%;animation:lgSpin .8s linear infinite;"></div>
</div>

<div id="maintToast" style="position:fixed;bottom:20px;left:20px;z-index:999;width:220px;max-width:80vw;background:rgba(8,0,0,0.97);border:1px solid rgba(255,0,0,0.4);border-radius:14px;padding:14px 14px 12px;backdrop-filter:blur(12px);transform:translateY(140%);pointer-events:none;transition:transform .4s ease;box-shadow:0 0 40px rgba(255,0,0,0.15);">
  <div id="maintToastTitle" style="font-size:10px;color:#ff2a2a;margin-bottom:6px;letter-spacing:1px;">Тех. неполадки</div>
  <div id="maintToastMsg" style="font-size:7px;color:rgba(255,200,200,0.6);line-height:1.6;"></div>
</div>

<div class="fluff-wrap">
  <div class="fluff fluff-1"></div>
  <div class="fluff fluff-2"></div>
</div>
<canvas class="canvas-bg" id="matrixCanvas"></canvas>

<div class="wrap" id="app">
  <div style="position:relative">
    <div class="logo" style="display:flex;align-items:center;gap:14px"><img src="https://mezets.github.io/mezets.design/favicon.png" alt="" style="width:48px;height:48px;image-rendering:pixelated;flex-shrink:0"><span style="font-size:22px;letter-spacing:3px">Mezets</span></div>
    <div class="logo-sub">ЧАТ</div>
    <a href="/mezets.design/" class="btn btn-sm" style="position:absolute;top:6px;right:0">← На главную</a>
  </div>

  <div id="loadingState">
    <div class="loader"></div>
  </div>

  <div id="notFound" style="display:none">
    <div class="card" style="text-align:center;padding:40px;">
      <div style="font-size:9px;color:rgba(255,200,200,0.4);">Заказ не найден</div>
      <a href="/mezets.design/" class="btn" style="margin-top:16px;">На главную</a>
    </div>
  </div>

  <div id="chatContent" style="display:none" class="chat-layout">
    <div class="chat-layout-sidebar">
      <div class="card">
        <div class="order-info">
          <div class="order-info-left">
            <div class="order-id" id="orderIdDisplay">Заказ #—</div>
            <div class="order-meta" id="orderMeta"></div>
          </div>
          <div>
            <div class="order-price" id="orderPrice"></div>
            <div class="order-status-badge" id="orderStatusBadge"></div>
            <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
              <button class="btn btn-sm" id="editOrderBtn" onclick="toggleOrderEdit()" style="display:none;width:100%">✎ Редактировать</button>
              <button class="btn btn-sm btn-danger" id="closeOrderBtn" onclick="closeOrder()" style="display:none;width:100%">Закрыть заказ</button>
            </div>
          </div>
        </div>
        <div class="order-desc-box" id="orderDescBox"></div>

        <div id="orderEditForm" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,0,0,0.15)">
          <div class="order-label" style="font-size:6px;margin-bottom:6px">Описание заказа</div>
          <textarea id="orderEditDescInput" class="order-textarea" style="height:100px;margin-bottom:10px" placeholder="Опиши задачу..."></textarea>

          <div class="order-label" style="font-size:6px;margin-bottom:6px">Способ оплаты</div>
          <div id="orderEditPaymentInput" class="payment-option-group" data-value="sbp" oninput="onPaymentChange(event)" style="margin-bottom:10px">
            <label class="payment-option active" data-val="sbp"><input type="radio" name="orderEditPayment" value="sbp" checked>СБП</label>
            <label class="payment-option" data-val="card"><input type="radio" name="orderEditPayment" value="card">Карта</label>
            <label class="payment-option" data-val="steam_gift"><input type="radio" name="orderEditPayment" value="steam_gift">Подарок Steam</label>
            <label class="payment-option" data-val="steam_topup"><input type="radio" name="orderEditPayment" value="steam_topup">Пополнение Steam</label>
          </div>

          <div style="display:flex;gap:8px">
            <button class="btn btn-sm" onclick="saveOrderEditClient()" style="flex:1;border-color:rgba(0,200,0,0.35);color:#55ff55">💾 Сохранить</button>
            <button class="btn btn-sm" onclick="toggleOrderEdit(false)" style="flex:1">Отмена</button>
          </div>
          <div class="status" id="orderEditStatus" style="margin-top:8px"></div>
        </div>
      </div>
    </div>

    <div class="chat-layout-main">
      <div class="card">
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-row">
          <button class="btn btn-sm chat-file-btn" onclick="uploadFile()" title="Прикрепить файл">📎</button>
          <input class="chat-input" id="msgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}">
          <button class="btn chat-send" onclick="sendMsg()">→</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../common.js"></script>
<script>
checkSiteBanOnLoad();
checkMaintenance();

const API = BAN_API; // из common.js
let orderId = null;
let currentUser = null;
let CURRENT_ORDER = null;
let pollTimer = null;

function getSession() {
  try { return localStorage.getItem('mezets_session') || ''; } catch(e) { return ''; }
}

function g(name) { return document.getElementById(name); }

async function init() {
  const params = new URLSearchParams(window.location.search);
  orderId = params.get('id');
  if (!orderId) { showNotFound(); return; }

  const session = getSession();
  if (!session) { window.location.href = '/mezets.design/'; return; }

  try {
    const rMe = await fetch(`${API}/api/me?session=${encodeURIComponent(session)}`);
    if (!rMe.ok) { window.location.href = '/mezets.design/'; return; }
    const dMe = await rMe.json();
    currentUser = dMe.user;
  } catch(e) { window.location.href = '/mezets.design/'; return; }

  await loadOrder();

  // Точки как в админке
  const dotCanvas = g('matrixCanvas');
  const dotCtx = dotCanvas.getContext('2d');
  function resizeDots() { dotCanvas.width = innerWidth; dotCanvas.height = innerHeight; }
  resizeDots();
  let dots = [];
  function initDots() {
    dots = [];
    const n = Math.round((innerWidth * innerHeight) / 12000);
    for (let i = 0; i < n; i++) dots.push({
      x: Math.random()*dotCanvas.width, y: Math.random()*dotCanvas.height,
      r: Math.random()*1.2+0.3, dx:(Math.random()-.5)*.12, dy:(Math.random()-.5)*.12
    });
  }
  initDots();
  window.addEventListener('resize', () => { resizeDots(); initDots(); });
  (function animateDots() {
    dotCtx.clearRect(0,0,dotCanvas.width,dotCanvas.height);
    for (let d of dots) {
      dotCtx.beginPath(); dotCtx.arc(d.x,d.y,d.r,0,Math.PI*2);
      dotCtx.fillStyle='rgba(255,0,0,0.5)'; dotCtx.fill();
      d.x+=d.dx; d.y+=d.dy;
      if(d.x<0)d.x=dotCanvas.width; if(d.x>dotCanvas.width)d.x=0;
      if(d.y<0)d.y=dotCanvas.height; if(d.y>dotCanvas.height)d.y=0;
    }
    requestAnimationFrame(animateDots);
  })();
}

async function loadOrder() {
  const session = getSession();
  try {
    const r = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
    if (!r.ok) { showNotFound(); return; }
    const d = await r.json();
    renderOrder(d.order, d.messages || [], d.attachments || []);
    startPolling();
  } catch(e) { showNotFound(); }
}

function showNotFound() {
  g('loadingState').style.display = 'none';
  g('notFound').style.display = 'block';
}

const CATEGORY_LABELS = {
  'design': 'Дизайн', 'discord_bot': 'Discord бот', 'telegram_bot': 'Telegram бот',
  'website': 'Сайт', 'other': 'Другое',
};

function renderOrder(order, messages, attachments) {
  g('loadingState').style.display = 'none';
  g('chatContent').style.display = 'block';

  const statusLabels = { 'new': 'Новый', 'in_progress': 'В работе', 'completed': 'Выполнен', 'cancelled': 'Отменён' };
  g('orderIdDisplay').textContent = `Заказ #${order.id}`;
  document.title = `Mezets - Чат заказа #${order.id}`;
  g('orderMeta').textContent = `${CATEGORY_LABELS[order.category] || order.category || ''} · ${order.created_at ? order.created_at.slice(0, 10) : ''}`;
  g('orderPrice').textContent = order.estimated_price ? `${order.estimated_price} ₽` : '';
  const badge = g('orderStatusBadge');
  badge.textContent = statusLabels[order.status] || order.status;
  badge.className = 'order-status-badge status-' + order.status;
  const description = order.description || '';
  g('orderDescBox').textContent = description
    .replace(/\s+(Банк:\s*)/i, '\n$1')
    .replace(/\s+(Выбрано:\s*)/i, '\n$1')
    .replace(/^\s+|\s+$/g, '');

  const closeBtn = g('closeOrderBtn');
  if (closeBtn) {
    closeBtn.style.display = (order.status === 'completed' || order.status === 'cancelled') ? 'none' : 'inline-flex';
  }
  const editBtn = g('editOrderBtn');
  if (editBtn) {
    editBtn.style.display = (order.status === 'completed' || order.status === 'cancelled') ? 'none' : 'inline-flex';
  }
  CURRENT_ORDER = order;

  renderMessages(messages, attachments);
}

function onPaymentChange(e) {
  const group = e.currentTarget;
  const val = e.target.value;
  group.dataset.value = val;
  group.querySelectorAll('.payment-option').forEach(el => el.classList.toggle('active', el.dataset.val === val));
}

function setPaymentValue(id, val) {
  const group = g(id);
  if (!group) return;
  group.dataset.value = val;
  group.querySelectorAll('.payment-option').forEach(el => {
    const active = el.dataset.val === val;
    el.classList.toggle('active', active);
    const input = el.querySelector('input');
    if (input) input.checked = active;
  });
}

function getPaymentValue(id) {
  const group = g(id);
  return group ? group.dataset.value : '';
}

function toggleOrderEdit(force) {
  const box = g('orderEditForm');
  if (!box) return;
  const show = force === undefined ? box.style.display === 'none' : !!force;
  box.style.display = show ? 'block' : 'none';
  if (show && CURRENT_ORDER) {
    g('orderEditDescInput').value = CURRENT_ORDER.description || '';
    setPaymentValue('orderEditPaymentInput', CURRENT_ORDER.payment_method || 'sbp');
  }
}

async function saveOrderEditClient() {
  if (!orderId) return;
  const status = g('orderEditStatus');
  const description = g('orderEditDescInput').value.trim();
  const payment_method = getPaymentValue('orderEditPaymentInput');
  if (!description) {
    showStatus(status, 'Опиши задачу', 'err');
    return;
  }
  const session = getSession();
  showStatus(status, 'Сохраняю...', 'info');
  try {
    const r = await fetch(`${API}/api/order/${orderId}/edit?session=${encodeURIComponent(session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description, payment_method }),
    });
    if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.error || 'Сервер отклонил (' + r.status + ')'); }
    showStatus(status, 'Сохранено!', 'ok');
    toggleOrderEdit(false);
    await loadOrder();
  } catch(e) {
    showStatus(status, 'Ошибка: ' + e.message, 'err');
  }
}

function showStatus(el, text, kind) {
  if (!el) return;
  el.textContent = text;
  el.className = 'status ' + kind;
}

async function closeOrder() {
  if (!confirm('Закрыть заказ #' + orderId + '?\nПосле закрытия оформить его заново будет нельзя — только создать новый.')) return;
  const session = getSession();
  const btn = g('closeOrderBtn');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/api/order/${orderId}/close?session=${encodeURIComponent(session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    });
    if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.error || 'close failed'); }
    await loadOrder();
  } catch(e) {
    alert('Не удалось закрыть заказ: ' + e.message);
  }
  btn.disabled = false;
}

function renderMessages(messages, attachments) {
  const box = g('chatBox');
  if (!messages.length) {
    box.innerHTML = '<div class="empty-chat">Сообщений пока нет. Напиши что-нибудь!</div>';
    return;
  }
  const attMap = {};
  if (attachments) attachments.forEach(a => {
    if (a.message_id) {
      if (!attMap[a.message_id]) attMap[a.message_id] = [];
      attMap[a.message_id].push(a);
    }
  });

  function isImageFile(name, url) {
    return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i.test(name || url || '');
  }

  box.innerHTML = messages.map(m => {
    const isUser = !m.from_discord;
    const atts = attMap[m.id] || [];
    const attHtml = atts.length ? '<div class="msg-attachments">' + atts.map(a => {
      if (isImageFile(a.filename, a.discord_url)) {
        return `<a href="${a.discord_url}" target="_blank" class="msg-attachment-img"><img src="${a.discord_url}" alt="${a.filename || 'изображение'}" loading="lazy"></a>`;
      }
      return `<a href="${a.discord_url}" target="_blank" class="msg-attachment">${a.filename || 'файл'} ↓</a>`;
    }).join('') + '</div>' : '';
    const author = isUser ? (currentUser && currentUser.username ? currentUser.username : 'Вы') : m.author;
    return `<div class="msg msg-${isUser ? 'user' : 'discord'}">
      <div class="msg-author">${escapeHtml(author)}</div>
      <div class="msg-text">${escapeHtml(m.content || '')}</div>
      ${attHtml}
      <div class="msg-time">${m.created_at ? m.created_at.slice(11, 19) : ''}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function startPolling() {
  pollTimer = setInterval(async () => {
    const session = getSession();
    try {
      const r = await fetch(`${API}/api/order/${orderId}/messages?session=${encodeURIComponent(session)}`);
      if (!r.ok) return;
      const d = await r.json();
      const box = g('chatBox');
      const oldCount = box.querySelectorAll('.msg').length;
      if (d.messages && d.messages.length !== oldCount) {
        const r2 = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
        if (r2.ok) {
          const d2 = await r2.json();
          renderMessages(d2.messages || [], d2.attachments || []);
        }
      }
    } catch(e) {}
  }, 3000);
}

async function sendMsg() {
  const input = g('msgInput');
  const content = input.value.trim();
  if (!content) return;

  const session = getSession();
  input.disabled = true;

  try {
    const r = await fetch(`${API}/api/order/${orderId}/message?session=${encodeURIComponent(session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (!r.ok) throw new Error('send failed');
    input.value = '';
    // Reload immediately
    const r2 = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
    if (r2.ok) {
      const d = await r2.json();
      renderMessages(d.messages || [], d.attachments || []);
    }
  } catch(e) {
    console.error('send error:', e);
  }
  input.disabled = false;
  input.focus();
}

function uploadFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('Файл слишком большой (макс 10MB)'); return; }
    const session = getSession();
    const formData = new FormData();
    formData.append('order_id', orderId);
    formData.append('file', file);
    try {
      await fetch(`${API}/api/order/upload?session=${encodeURIComponent(session)}`, {
        method: 'POST', body: formData,
      });
      const r = await fetch(`${API}/api/order/${orderId}?session=${encodeURIComponent(session)}`);
      if (r.ok) {
        const d = await r.json();
        renderMessages(d.messages || [], d.attachments || []);
      }
    } catch(e) { console.error('upload error:', e); }
  };
  input.click();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
